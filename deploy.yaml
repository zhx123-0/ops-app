apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-app
  template:
    metadata:
      labels:
        app: ops-app
    spec:
      containers:
      - name: ops-app
        image: ops-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ops-app
spec:
  type: NodePort
  selector:
    app: ops-app
  ports:
  - port: 5000
    targetPort: 5000
